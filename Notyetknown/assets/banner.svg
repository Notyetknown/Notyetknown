<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Rajkaran Sharma, Software Engineer and Full-Stack Developer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080c1a"/><stop offset="1" stop-color="#140d2b"/></linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#00e5ff"/><stop offset="0.5" stop-color="#7c4dff"/><stop offset="1" stop-color="#ff4d9d"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-2 0" to="0 0" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.055"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="7s" repeatCount="indefinite"/>
  </pattern>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"><animate attributeName="stdDeviation" values="3;9;3" dur="3.5s" repeatCount="indefinite"/></feGaussianBlur>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
</defs>

<g clip-path="url(#card)">
